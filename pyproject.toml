[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygments-beancount"
dynamic = ["version"]
description = "Pygments lexer for Beancount ledgers, for highlighted ledgers in Sphinx and MyST documentation"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Érico Andrei", email = "ericof@gmail.com" }
]
keywords = ["beancount", "pygments", "lexer", "syntax highlighting", "sphinx", "myst"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
dependencies = [
    "pygments>=2.13",
]

[project.urls]
Homepage = "https://github.com/ericof/pygments-beancount"
Documentation = "https://ericof.github.io/pygments-beancount/"
Repository = "https://github.com/ericof/pygments-beancount"
Issues = "https://github.com/ericof/pygments-beancount/issues"
Changelog = "https://github.com/ericof/pygments-beancount/blob/main/CHANGELOG.md"

# The key is only a label: Pygments finds the lexer by its aliases.
[project.entry-points."pygments.lexers"]
beancount = "pygments_beancount.lexer:BeancountLexer"

[dependency-groups]
dev = [
    "beancount>=3.0.0",
    "mypy>=1.13.0",
    "myst-parser>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "sphinx>=8.0.0",
    "types-pygments>=2.18.0",
]
docs = [
    "linkify-it-py>=2.0.3",
    "myst-parser>=4.0.0",
    "plone-sphinx-theme>=1.4.3",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-sitemap>=2.6.0",
    "sphinxext-opengraph>=0.9.1",
    "vale>=3.9.0",
]
release = [
    "towncrier>=24.8.0",
    "zest-releaser[recommended]>=9.9.1",
    "zestreleaser-towncrier>=2.0.1",
]

[tool.hatch.version]
path = "src/pygments_beancount/__init__.py"

# An explicit list: everything else in the checkout stays out of the sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygments_beancount"]

# make release runs fullrelease. The version file comes from [tool.hatch.version];
# nothing is uploaded from here: pushing the tag starts .github/workflows/release.yml,
# which publishes to PyPI through trusted publishing.
[tool.zest-releaser]
history-file = "CHANGELOG.md"
history-format = "md"
tag-format = "v{version}"
release = false

# zest.releaser runs check-manifest before a release. These files stay out of
# the sdist on purpose (see the include list above); anything else in git that
# the sdist misses is still reported.
[tool.check-manifest]
ignore = [
    ".python-version",
    ".vale.ini",
    "CLAUDE.md",
    "Makefile",
    "uv.lock",
    "docs/**",
    "news/**",
]

[tool.towncrier]
package = "pygments_beancount"
package_dir = "src"
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/ericof/pygments-beancount/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
# typeshed leaves bygroups() untyped.
untyped_calls_exclude = ["pygments.lexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "sphinx: builds a Sphinx project (needs Sphinx and MyST-Parser)",
]

[tool.coverage.run]
source_pkgs = ["pygments_beancount"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
