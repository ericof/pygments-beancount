version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    labels:
      # Setting labels replaces Dependabot's defaults, so keep them
      - "dependencies"
      - "github_actions"
      - "skip changelog"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Check for updates to the locked Python dependencies every week
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "skip changelog"
    groups:
      # One pull request for all minor and patch updates
      python-minor:
        update-types:
          - "minor"
          - "patch"
